name: GHAV VueUse timing
'on':
  push:
    branches:
    - codex/ghav-vueuse-ours
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        persist-credentials: false
    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
    - name: Set node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: lts/*
    - name: Setup
      run: npm i -g @antfu/ni
    - name: Install
      run: nci
    - name: Lint
      run: nr lint
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
        - 20.x
        - lts/*
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        persist-credentials: false
    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
    - name: Set node version to ${{ matrix.node }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: ${{ matrix.node }}
    - name: Setup
      run: npm i -g @antfu/ni
    - name: Install
      run: nci
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
    - name: Build
      run: nr build
    - name: Typecheck
      run: nr typecheck
    - name: unit tests
      run: pnpm run test:cov
    - name: browser tests
      run: pnpm exec vitest run --project='browser (webkit)'
    - name: server tests
      run: pnpm run test:server
    - name: exports tests
      run: pnpm run test:exports
    - name: Playground Smoke Test
      if: matrix.node == 'lts/*'
      run: cd playgrounds && bash ./build.sh
